services:
  db:
    image: postgres
    restart: always
    volumes:
      # - ./docker-entrypoint.sql:/docker-entrypoint-initdb.d/docker-entrypoint.sql
      - postgresql:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: "hibernatedb"
      POSTGRES_USER: "hibernateuser"
      POSTGRES_PASSWORD: "12345"
    ports:
      - "5433:5432"

  ollama-neuro:
    image: ollama/ollama
    # command: ollama pull llama3.2
    container_name: ollama
    ports:
      - 11434:11434
    volumes:
      - ollama:/root/.ollama

  # minio:
    # image: minio/minio:latest
    # command: server --address localhost:9000 /data
    # ports:
    #   - "9000:9000"  # MinIO API port
    #   - "9001:9001"  # MinIO Console port
    # environment:
    #   MINIO_ROOT_USER: user
    #   MINIO_ROOT_PASSWORD: secret_key
    # volumes:
    #   - minio_data:/data  # Persistent storage

  # minio:
  #   image: minio/minio:latest
  #   container_name: minio
  #   environment:
  #     MINIO_ROOT_USER: "minioadmin"
  #     MINIO_ROOT_PASSWORD: "minioadmin"
  #   volumes:
  #     - ./data:/data
  #   ports:
  #     - 9002:9002
  #     - 9001:9001
  #   command: server /data --address :9002

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  postgresql:
